<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Confirmar reserva - Inmobiliarias Paqui</title>
    <link rel="stylesheet" th:href="@{/css/stylePago.css}"/>
    <link rel="stylesheet" th:href="@{/css/styleHeader.css}"/>
    <style>
        /* Estilos básicos para la lógica de mostrar/ocultar */
        .form-pago {
            display: none;
        }

        .form-pago.active {
            display: block;
        }

        .btn-pago {
            opacity: 0.6;
            cursor: pointer;
        }

        .btn-pago.active {
            opacity: 1;
            border: 2px solid #0056b3;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div th:replace="~{fragments/header-2 :: header_2-nav}"></div>

<main>
    <section class="hero">
        <h1>Confirmar reserva</h1>
        <p>Revisa los detalles y completa tu pago de forma segura.</p>
    </section>

    <section class="payment-section">
        <div class="payment-container">

            <div class="resumen-box">
                <h2>Resumen de reserva</h2>
                <div id="resumen-reserva">
                    <h3 th:text="${reserva.alojamiento.nombre}">Nombre Alojamiento</h3>

                    <p>
                        <strong>Entrada:</strong> <span th:text="${reserva.fechaEntrada}"></span><br>
                        <strong>Salida:</strong> <span th:text="${reserva.fechaSalida}"></span>
                    </p>

                    <p id="precioAlojamiento" style="font-size: 1.5em; color: green; font-weight: bold;">
                        Total: <span th:text="${precioAPagar} + ' €'">0 €</span>
                    </p>

                    <img id="fotoAlojamiento"
                         th:src="${reserva.alojamiento.fotoUrl}"
                         alt="Imagen del alojamiento"
                         style="width: 100%; border-radius: 8px; margin-top: 10px;"
                         th:if="${reserva.alojamiento.fotoUrl != null}"/>
                </div>
            </div>

            <div class="metodo-box">
                <h2>Método de pago</h2>

                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <button id="btnSelectTarjeta" type="button" class="btn-pago active"
                            onclick="cambiarMetodo('tarjeta')">
                        💳 Tarjeta
                    </button>
                    <button id="btnSelectPayPal" type="button" class="btn-pago" onclick="cambiarMetodo('paypal')">
                        🅿️ PayPal
                    </button>
                </div>

                <form th:action="@{/pagos/procesar}" method="post" id="formTarjeta" class="form-pago active">

                    <input type="hidden" name="idReserva" th:value="${reserva.id}"/>
                    <input type="hidden" name="metodoPago" value="tarjeta"/>

                    <input type="text" placeholder="Titular de la tarjeta" required/>
                    <input
                            type="text"
                            name="numeroTarjeta"
                            placeholder="Número de la tarjeta"
                            minlength="13" maxlength="19"
                            required
                    />
                    <div class="flex-row" style="display: flex; gap: 10px;">
                        <input type="text" placeholder="CVV" maxlength="3" required style="width: 50%;"/>
                        <input type="text" placeholder="MM/AA" required style="width: 50%;"/>
                    </div>

                    <button type="submit" class="btn-pago"
                            style="width: 100%; margin-top: 15px; background: #007bff; color: white; opacity: 1;">
                        Pagar con Tarjeta
                    </button>
                </form>

                <form th:action="@{/pagos/procesar}" method="post" id="formPayPal" class="form-pago">

                    <input type="hidden" name="idReserva" th:value="${reserva.id}"/>
                    <input type="hidden" name="metodoPago" value="paypal"/>

                    <input type="email" name="emailPaypal" placeholder="Email de PayPal" required/>
                    <input type="password" placeholder="Contraseña PayPal" required/>

                    <button type="submit" class="btn-pago btn-paypal"
                            style="width: 100%; margin-top: 15px; background: #ffc439; color: black; opacity: 1;">
                        Pagar con PayPal
                    </button>
                </form>

                <div th:if="${param.error}" style="color: red; margin-top: 15px; text-align: center;">
                    Hubo un problema con el pago. Inténtalo de nuevo.
                </div>

            </div>
        </div>
    </section>
</main>

<footer>© 2025 Inmobiliarias Paqui</footer>

<script src="/js/pago.js"></script>

</body>
</html>
