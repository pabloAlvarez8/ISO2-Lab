<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />


  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Detalles del alojamiento — Inmobiliarias Paqui</title>

  <!-- CSS principal de la página -->
  <link rel="stylesheet" th:href="@{/css/stylePaginaPrincipal.css}" />
  <!-- CSS específico de la vista de detalle -->
  <link rel="stylesheet" th:href="@{/css/styleDetalle.css}" />
</head>

<body>
  <header>
    <div class="container">

      <!-- Inm Paqui (logo) que te devuelve a la página inicial -->
      <div class="logo" style="cursor: pointer" onclick="volverInicio()">
        Inmobiliarias Paqui
      </div>

      <!-- Botón para login / registro -->
      <button class="btn-register" 
      onclick="window.location.href='/register'">
        Iniciar sesión o registrarse
      </button>

    </div>
  </header>

  <main>

    <!-- Contenedor principal del encabezado del alojamiento -->
    <div class="lodging-header">

      <!-- Carrusel de imágenes -->
      <div class="carousel">

        <!-- Botón imagen anterior -->
        <button class="carousel-btn prev" onclick="prevSlide()">❮</button>

        <!-- Imagen principal del alojamiento -->
        <img id="detalleImg" src="" alt="Imagen del alojamiento" />

        <!-- Botón imagen siguiente -->
        <button class="carousel-btn next" onclick="nextSlide()">❯</button>

      </div>

      <!-- Datos dinámicos del alojamiento -->
      <h1 id="detalleTitulo"></h1>
      <p id="detalleCiudad"></p>
      <p id="detalleTipo"></p>
      <p id="detalleCapacidad"></p>
      <p id="detalleDistancia"></p>
      <p id="detalleRating"></p>

      <!-- Precio + acción de reserva -->
      <div class="price-reserve">
        <p id="detallePrecio" style="font-size: 20px; font-weight: 700; color: #0071c2"></p>

        <button class="btn-reserve" onclick="reservar()">
          Reservar ahora
        </button>
      </div>

    </div>

    <!-- Descripción del alojamiento -->
    <h2>Información sobre el alojamiento</h2>
    <p id="lodgingDescription" style="margin-top: 10px; line-height: 1.6; color: #444"></p>

    <!-- Sección de comentarios -->
    <section class="comments">
      <h2>Comentarios de usuarios</h2>

      <!-- Comentarios -->
      <div id="commentsList"></div>
    </section>

    <!-- Botón para volver al inicio -->
    <button class="btn-volver" onclick="volverInicio()">
      ← Volver a inicio
    </button>

  </main>

  <footer>
    © 2025 Inmobiliarias Paqui
  </footer>

  <!-- JS que maneja toda la lógica de detalle -->
  <script th:src="@{/js/detalle.js}"></script>
</body>
</html>
