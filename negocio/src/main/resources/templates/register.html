<!-- 
  Vista de Registro de Usuario.
  Utiliza el motor de plantillas Thymeleaf para vincular un formulario HTML
  con el objeto de dominio 'User' del backend (Data Binding).
-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Registro de Usuario</title>
    
    <!-- 
      Enlace a la hoja de estilos. 
      La expresión '@{...}' resuelve la ruta relativa al contexto de la aplicación,
      asegurando que el CSS cargue correctamente en cualquier entorno de despliegue.
    -->
    <link rel="stylesheet" th:href="@{/css/styleRegister.css}" />
  </head>
  <body>
    <div class="container">
      <h2>Regístrate aquí</h2>

      <!-- 
        Bloque de Feedback.
        Renderiza mensajes de éxito o error provenientes de 'RedirectAttributes' 
        del controlador. Solo se muestran si el atributo existe en el modelo.
      -->
      <div
        th:if="${successMessage}"
        class="alert alert-success"
        th:text="${successMessage}"
      ></div>
      <div
        th:if="${errorMessage}"
        class="alert alert-danger"
        th:text="${errorMessage}"
      ></div>

      <!-- 
        Formulario de Registro.
        th:action="@{/register}": URL de destino del POST.
        th:object="${user}": Vincula el formulario completo al objeto 'User' vacío 
        que el controlador inyectó en el modelo.
      -->
      <form
        th:action="@{/register}"
        th:object="${user}"
        method="post"
        class="form-register"
      >
        <!-- 
          Inputs vinculados con th:field="*{propiedad}".
          Esto genera automáticamente los atributos 'name', 'id' y 'value',
          mapeándolos a las propiedades de la clase Java 'User'.
        -->
        <input type="text" th:field="*{nombre}" placeholder="Nombre" required />

        <input
          type="text"
          th:field="*{apellido}"
          placeholder="Apellidos"
          required
        />

        <input
          type="email"
          th:field="*{email}"
          placeholder="Correo electrónico"
          required
        />

        <input
          type="password"
          th:field="*{password}"
          placeholder="Contraseña"
          required
        />

        <input
          type="text"
          th:field="*{direccion}"
          placeholder="Dirección (opcional)"
        />

        <!-- 
          Campo oculto para el Rol.
          Usa Spring Expression Language (SpEL) con 'T(...)' para acceder 
          estáticamente al Enum 'Role.INQUILINO' definido en la clase User.
          Esto asegura que todos los registros públicos sean inquilinos por defecto.
        -->
        <input
          type="hidden"
          th:field="*{role}"
          th:value="${T(inmobiliaria.es.uclm.negocio.user.User.Role).INQUILINO}"
        />

        <button type="submit">Continuar</button>
      </form>

      <!-- Navegación cruzada hacia el login -->
      <div class="login-link">
        ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión aquí</a>
      </div>
    </div>
  </body>
</html>
