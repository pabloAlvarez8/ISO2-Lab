<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${alojamiento.nombre}">Detalle Alojamiento</title>

  <link rel="stylesheet" th:href="@{/css/stylePaginaPrincipal.css}" />
  <link rel="stylesheet" th:href="@{/css/styleDetalle.css}" />
  <link rel="stylesheet" th:href="@{/css/styleHeader.css}" />
</head>

<body>

<div th:replace="~{fragments/header-2 :: header_2-nav}"></div>

<main>

  <div class="lodging-header">

    <div class="carousel" style="display: flex; justify-content: center;">
      <img id="detalleImg"
           th:src="${alojamiento.fotoUrl != null ? alojamiento.fotoUrl : '/images/no-image.png'}"
           alt="Imagen del alojamiento"
           style="max-width: 100%; height: auto; border-radius: 8px;" />
    </div>

    <h1 th:text="${alojamiento.nombre}">Título Alojamiento</h1>

    <p><strong>Ciudad:</strong> <span th:text="${alojamiento.ciudad}">Ciudad</span></p>
    <p><strong>Tipo:</strong> <span th:text="${alojamiento.tipo}">Tipo</span></p>
    <p><strong>Capacidad:</strong> <span th:text="${alojamiento.capacidad} + ' personas'">Capacidad</span></p>

    <p id="detallePrecio" style="font-size: 20px; font-weight: 700; color: #0071c2">
      <span th:text="${alojamiento.precio}">0</span> € / noche
    </p>

    <p th:text="${alojamiento.descripcion}" style="margin-top: 10px; line-height: 1.6; color: #444">
      Descripción...
    </p>

    <div class="price-reserve" style="background: #f9f9f9; padding: 20px; border-radius: 10px; margin-top: 20px;">

      <h3>Selecciona tus fechas</h3>

      <form th:action="@{/reservas/crear}" method="post" style="display: flex; flex-direction: column; gap: 10px;">

        <input type="hidden" name="alojamientoId" th:value="${alojamiento.id}" />

        <div style="display: flex; gap: 10px;">
          <div style="flex: 1;">
            <label>Llegada:</label>
            <input type="date" name="fechaEntrada" required style="width: 100%; padding: 8px;">
          </div>
          <div style="flex: 1;">
            <label>Salida:</label>
            <input type="date" name="fechaSalida" required style="width: 100%; padding: 8px;">
          </div>
        </div>

        <button type="submit" class="btn-reserve" style="margin-top: 10px; cursor: pointer;">
          Reservar y Pagar
        </button>
      </form>

    </div>

  </div>

  <section class="comments">
    <h2>Comentarios de usuarios</h2>
    <p>Sin comentarios por el momento.</p>
  </section>

  <a th:href="@{/alojamientos}" class="btn-volver" style="display: inline-block; margin-top: 20px; text-decoration: none;">
    ← Volver al buscador
  </a>

</main>

<footer>
  © 2025 Inmobiliarias Paqui
</footer>
</body>
</html>
