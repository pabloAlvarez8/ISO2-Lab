<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar Alojamiento - Inmobiliarias Paqui</title>
    
    <link rel="stylesheet" th:href="@{/css/styleNuevoAlojamiento.css}">
    <link rel="stylesheet" th:href="@{/css/styleHeader.css}">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <div th:replace="~{fragments/header-2 :: header_2-nav}"></div>

    <main>
        <div class="form-container">
            <div class="form-header">
                <i class="fas fa-home" style="font-size: 40px; color: #4b8fe7; margin-bottom: 15px;"></i>
                <h2>Publicar nuevo alojamiento</h2>
                <p>Rellena los datos de tu propiedad para empezar a recibir viajeros.</p>
            </div>

            <form th:action="@{/alojamientos/guardar}" th:object="${alojamiento}" method="post">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label><i class="fas fa-pen"></i> Nombre del Alojamiento</label>
                        <input type="text" th:field="*{nombre}" placeholder="Ej: Cabaña Rústica en el Bosque" required />
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-map-marker-alt"></i> Ciudad</label>
                        <input type="text" th:field="*{ciudad}" placeholder="Ej: Cuenca" required />
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group" style="flex: 2;"> <label><i class="far fa-map"></i> Dirección Completa</label>
                        <input type="text" th:field="*{direccion}" placeholder="Calle, número, piso..." required />
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-building"></i> Tipo de inmueble</label>
                        <select th:field="*{tipo}" required>
                            <option value="Casa">Casa</option>
                            <option value="Apartamento">Apartamento</option>
                            <option value="Loft">Loft</option>
                            <option value="Chalet">Chalet</option>
                            <option value="Estudio">Estudio</option>
                        </select>
                    </div>
                </div>

                <div class="form-group full-width" style="margin-bottom: 25px;">
                    <label><i class="fas fa-align-left"></i> Descripción</label>
                    <textarea th:field="*{descripcion}" rows="4" placeholder="Describe lo que hace especial a tu alojamiento... (vistas, servicios, ambiente)"></textarea>
                </div>

                <div class="triple-grid">
                    <div class="form-group">
                        <label><i class="fas fa-euro-sign"></i> Precio noche (€)</label>
                        <input type="number" step="0.01" th:field="*{precio}" placeholder="0.00" required />
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-users"></i> Capacidad</label>
                        <input type="number" th:field="*{capacidad}" min="1" placeholder="Ej: 4" required />
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-route"></i> Dist. Centro (km)</label>
                        <input type="number" step="0.1" th:field="*{distanciaCentro}" placeholder="Ej: 1.5" required />
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label><i class="fas fa-image"></i> URL Imagen Principal</label>
                        <input type="url" th:field="*{fotoUrl}" placeholder="https://ejemplo.com/foto.jpg" required />
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-file-contract"></i> Política Cancelación</label>
                        <select th:field="*{politicaCancelacion}">
                            <option value="FLEXIBLE">Flexible (Reembolso completo 24h antes)</option>
                            <option value="MODERADA">Moderada (Reembolso 50% 5 días antes)</option>
                            <option value="ESTRICTA">Estricta (Sin reembolso)</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-check-circle"></i> Publicar Alojamiento
                </button>

                <form th:action="@{/alojamientos/guardar}" th:object="${alojamiento}" method="post">
    
    <input type="hidden" th:field="*{id}" />

    </form>

        </div>
    </main>

    <footer>© 2025 Inmobiliarias Paqui </footer>

</body>
</html>
